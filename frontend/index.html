<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CloudVault — File Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0C0C0C;
      --surface:   #161616;
      --card:      #1C1C1C;
      --border:    #2A2A2A;
      --gold:      #C9A84C;
      --gold-glow: rgba(201,168,76,0.15);
      --gold-hover:#E8C56A;
      --text:      #FFFFFF;
      --muted:     #888888;
      --danger:    #EF4444;
      --success:   #22C55E;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ══════════════════════════════════════
       AUTH PAGE
    ══════════════════════════════════════ */
    #auth-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%),
        var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 0 60px rgba(201,168,76,0.06);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo .logo-icon {
      width: 52px;
      height: 52px;
      background: var(--gold-glow);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 12px;
    }

    .auth-logo h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .auth-logo span { color: var(--gold); }

    .auth-logo p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .tab-switch {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .tab-btn.active {
      background: var(--gold);
      color: #000;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 7px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .form-group input, .form-group select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    .form-group select option { background: var(--card); }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      letter-spacing: 0.2px;
    }

    .btn-primary:hover { background: var(--gold-hover); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .auth-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #FCA5A5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* ══════════════════════════════════════
       DASHBOARD PAGE
    ══════════════════════════════════════ */
    #dashboard-page { display: none; min-height: 100vh; }

    /* NAVBAR */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .nav-logo span { color: var(--gold); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px 5px 8px;
    }

    .nav-avatar {
      width: 28px;
      height: 28px;
      background: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #000;
    }

    .nav-username { font-size: 13px; font-weight: 500; }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    /* CONTENT */
    .content { max-width: 900px; margin: 0 auto; padding: 32px 24px; }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .page-subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }

    /* STATS */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }

    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -1px; }
    .stat-value span { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 2px; }

    /* UPLOAD ZONE */
    .upload-zone {
      background: var(--surface);
      border: 1.5px dashed var(--border);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 28px;
      position: relative;
    }

    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--gold);
      background: var(--gold-glow);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon { font-size: 32px; margin-bottom: 10px; }
    .upload-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .upload-sub { font-size: 12px; color: var(--muted); }

    .upload-progress {
      margin-top: 14px;
      display: none;
    }

    .progress-bar-wrap {
      background: var(--border);
      border-radius: 4px;
      height: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--gold);
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s;
    }

    /* FILES SECTION */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title { font-size: 14px; font-weight: 600; }

    .btn-refresh {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .btn-refresh:hover { border-color: var(--gold); color: var(--gold); }

    /* FILE TABLE */
    .files-table {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .table-header {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 120px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .file-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 120px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      transition: background 0.15s;
    }

    .file-row:last-child { border-bottom: none; }
    .file-row:hover { background: rgba(255,255,255,0.02); }

    .file-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
    }

    .file-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .file-icon.pdf  { background: rgba(239,68,68,0.15);  color: #FCA5A5; }
    .file-icon.img  { background: rgba(34,197,94,0.15);  color: #86EFAC; }
    .file-icon.doc  { background: rgba(59,130,246,0.15); color: #93C5FD; }
    .file-icon.other{ background: rgba(201,168,76,0.15); color: var(--gold); }

    .file-meta { font-size: 12px; color: var(--muted); }

    .file-actions { display: flex; gap: 8px; }

    .btn-download, .btn-delete {
      padding: 5px 12px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s;
      border: none;
    }

    .btn-download {
      background: var(--gold-glow);
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.2);
    }

    .btn-download:hover { background: rgba(201,168,76,0.25); }

    .btn-delete {
      background: rgba(239,68,68,0.1);
      color: #FCA5A5;
      border: 1px solid rgba(239,68,68,0.2);
    }

    .btn-delete:hover { background: rgba(239,68,68,0.2); }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 52px 20px;
      color: var(--muted);
    }

    .empty-state .empty-icon { font-size: 40px; margin-bottom: 14px; }
    .empty-state p { font-size: 14px; }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      z-index: 9999;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { border-color: rgba(34,197,94,0.4); }
    #toast.error   { border-color: rgba(239,68,68,0.4); }

    /* LOADING SPINNER */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ANIMATIONS */
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<!-- ═══════════════════ AUTH PAGE ═══════════════════ -->
<div id="auth-page">
  <div class="auth-card fade-in">
    <div class="auth-logo">
      <div class="logo-icon">🗄️</div>
      <h1>Cloud<span>Vault</span></h1>
      <p>Secure file management platform</p>
    </div>

    <div class="tab-switch">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="Enter username" autocomplete="off"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter password"/>
      </div>
      <button class="btn-primary" onclick="handleLogin()">Sign In</button>
      <div class="auth-error" id="login-error"></div>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-form" style="display:none;">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="Choose a username" autocomplete="off"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Min 6 characters"/>
      </div>
      <div class="form-group">
        <label>Account Type</label>
        <select id="reg-role">
          <option value="ROLE_USER">User</option>
          <option value="ROLE_ADMIN">Admin</option>
        </select>
      </div>
      <button class="btn-primary" onclick="handleRegister()">Create Account</button>
      <div class="auth-error" id="register-error"></div>
    </div>
  </div>
</div>

<!-- ═══════════════════ DASHBOARD PAGE ═══════════════════ -->
<div id="dashboard-page">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo">Cloud<span>Vault</span></div>
    <div class="nav-right">
      <div class="nav-user">
        <div class="nav-avatar" id="nav-avatar">A</div>
        <span class="nav-username" id="nav-username">User</span>
      </div>
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="content">
    <div class="page-title">My Files</div>
    <div class="page-subtitle">Upload, manage, and download your files securely.</div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Files</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Storage Used</div>
        <div class="stat-value" id="stat-size">0 <span>KB</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Account Type</div>
        <div class="stat-value" id="stat-role" style="font-size:16px;padding-top:4px;">—</div>
      </div>
    </div>

    <!-- UPLOAD ZONE -->
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-input" onchange="handleUpload(this)" multiple/>
      <div class="upload-icon">☁️</div>
      <div class="upload-title">Drop files here or click to upload</div>
      <div class="upload-sub">Any file type supported · Max 10MB per file</div>
      <div class="upload-progress" id="upload-progress">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- FILE LIST -->
    <div class="section-header">
      <div class="section-title">Uploaded Files</div>
      <button class="btn-refresh" onclick="loadFiles()">↻ Refresh</button>
    </div>

    <div class="files-table" id="files-container">
      <div class="empty-state">
        <div class="spinner"></div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
  const API = 'http://localhost:8081';
  let token = localStorage.getItem('cfm_token');
  let currentUser = localStorage.getItem('cfm_user');
  let currentRole = localStorage.getItem('cfm_role');

  // ── INIT ──────────────────────────────────────────────
  if (token) showDashboard();

  // ── TAB SWITCH ────────────────────────────────────────
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) =>
      b.classList.toggle('active', (i===0 && tab==='login') || (i===1 && tab==='register'))
    );
    document.getElementById('login-form').style.display    = tab==='login'    ? 'block' : 'none';
    document.getElementById('register-form').style.display = tab==='register' ? 'block' : 'none';
  }

  // ── AUTH ──────────────────────────────────────────────
  async function handleRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    const role     = document.getElementById('reg-role').value;
    const errEl    = document.getElementById('register-error');
    errEl.style.display = 'none';

    if (!username || !password) return showError(errEl, 'Please fill all fields');

    try {
      const res = await fetch(`${API}/api/auth/register`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({username, password, role})
      });
      const data = await res.text();
      if (!res.ok) return showError(errEl, JSON.parse(data).detail || data);
      showToast('✅ Account created! Please login.', 'success');
      switchTab('login');
      document.getElementById('login-username').value = username;
    } catch(e) {
      showError(errEl, 'Could not connect to server');
    }
  }

  async function handleLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl    = document.getElementById('login-error');
    errEl.style.display = 'none';

    if (!username || !password) return showError(errEl, 'Please fill all fields');

    try {
      const res  = await fetch(`${API}/api/auth/login`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({username, password})
      });
      const data = await res.json();
      if (!res.ok) return showError(errEl, data.message || 'Invalid credentials');
      token = data.token;
      currentUser = data.username;
      currentRole = data.role;
      localStorage.setItem('cfm_token', token);
      localStorage.setItem('cfm_user', currentUser);
      localStorage.setItem('cfm_role', currentRole);
      showDashboard();
    } catch(e) {
      showError(errEl, 'Could not connect to server. Is it running?');
    }
  }

  function handleLogout() {
    localStorage.removeItem('cfm_token');
    localStorage.removeItem('cfm_user');
    localStorage.removeItem('cfm_role');
    token = null;
    document.getElementById('auth-page').style.display = 'flex';
    document.getElementById('dashboard-page').style.display = 'none';
    showToast('👋 Logged out', 'success');
  }

  // ── DASHBOARD ─────────────────────────────────────────
  function showDashboard() {
    document.getElementById('auth-page').style.display = 'none';
    document.getElementById('dashboard-page').style.display = 'block';
    document.getElementById('nav-username').textContent = currentUser || 'User';
    document.getElementById('nav-avatar').textContent  = (currentUser||'U')[0].toUpperCase();
    document.getElementById('stat-role').textContent   = currentRole === 'ROLE_ADMIN' ? '👑 Admin' : '👤 User';
    loadFiles();
  }

  // ── FILE UPLOAD ───────────────────────────────────────
  async function handleUpload(input) {
    const files = input.files;
    if (!files.length) return;

    const progress = document.getElementById('upload-progress');
    const bar      = document.getElementById('progress-bar');
    progress.style.display = 'block';

    for (let i = 0; i < files.length; i++) {
      bar.style.width = Math.round(((i+0.5)/files.length)*100) + '%';
      const formData = new FormData();
      formData.append('file', files[i]);
      try {
        const res = await fetch(`${API}/api/files/upload`, {
          method: 'POST',
          headers: {'Authorization': `Bearer ${token}`},
          body: formData
        });
        if (!res.ok) {
          const err = await res.json();
          showToast('❌ ' + (err.message||'Upload failed'), 'error');
        }
      } catch(e) {
        showToast('❌ Upload failed', 'error');
      }
      bar.style.width = Math.round(((i+1)/files.length)*100) + '%';
    }

    setTimeout(() => {
      progress.style.display = 'none';
      bar.style.width = '0%';
    }, 600);

    input.value = '';
    showToast('✅ File uploaded successfully', 'success');
    loadFiles();
  }

  // ── LOAD FILES ────────────────────────────────────────
  async function loadFiles() {
    const container = document.getElementById('files-container');
    container.innerHTML = `<div class="empty-state"><div class="spinner"></div></div>`;

    try {
      const res   = await fetch(`${API}/api/files`, {
        headers: {'Authorization': `Bearer ${token}`}
      });
      const files = await res.json();

      // Update stats
      const totalSize = files.reduce((s,f) => s + f.fileSize, 0);
      document.getElementById('stat-total').textContent = files.length;
      document.getElementById('stat-size').innerHTML =
        totalSize > 1048576
          ? `${(totalSize/1048576).toFixed(1)} <span>MB</span>`
          : `${(totalSize/1024).toFixed(1)} <span>KB</span>`;

      if (!files.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📂</div>
            <p>No files uploaded yet.<br>Drop a file above to get started.</p>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="table-header">
          <div>File Name</div>
          <div>Type</div>
          <div>Size</div>
          <div>Uploaded</div>
          <div>Actions</div>
        </div>
        ${files.map(f => fileRow(f)).join('')}`;
    } catch(e) {
      container.innerHTML = `<div class="empty-state"><p>Failed to load files.</p></div>`;
    }
  }

  function fileRow(f) {
    const ext  = f.originalFilename.split('.').pop().toLowerCase();
    const icon = ext==='pdf' ? {cls:'pdf',ico:'📄'}
               : ['jpg','jpeg','png','gif','webp'].includes(ext) ? {cls:'img',ico:'🖼️'}
               : ['doc','docx'].includes(ext) ? {cls:'doc',ico:'📝'}
               : {cls:'other',ico:'📦'};
    const size = f.fileSize > 1048576
               ? `${(f.fileSize/1048576).toFixed(1)} MB`
               : `${(f.fileSize/1024).toFixed(1)} KB`;
    const date = new Date(f.uploadedAt).toLocaleDateString('en-IN',
                  {day:'2-digit',month:'short',year:'numeric'});
    const type = f.fileType ? f.fileType.split('/').pop().toUpperCase() : ext.toUpperCase();

    return `
      <div class="file-row fade-in">
        <div class="file-name">
          <div class="file-icon ${icon.cls}">${icon.ico}</div>
          <span>${escHtml(f.originalFilename)}</span>
        </div>
        <div class="file-meta">${type}</div>
        <div class="file-meta">${size}</div>
        <div class="file-meta">${date}</div>
        <div class="file-actions">
          <button class="btn-download" onclick="downloadFile(${f.id},'${escHtml(f.originalFilename)}')">↓</button>
          <button class="btn-delete"   onclick="deleteFile(${f.id})">✕</button>
        </div>
      </div>`;
  }

  // ── DOWNLOAD ──────────────────────────────────────────
  async function downloadFile(id, name) {
    try {
      const res  = await fetch(`${API}/api/files/download/${id}`, {
        headers: {'Authorization': `Bearer ${token}`}
      });
      if (!res.ok) return showToast('❌ Download failed', 'error');
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = name; a.click();
      URL.revokeObjectURL(url);
      showToast('⬇️ Downloading...', 'success');
    } catch(e) {
      showToast('❌ Download failed', 'error');
    }
  }

  // ── DELETE ────────────────────────────────────────────
  async function deleteFile(id) {
    if (!confirm('Delete this file?')) return;
    try {
      const res = await fetch(`${API}/api/files/${id}`, {
        method: 'DELETE',
        headers: {'Authorization': `Bearer ${token}`}
      });
      if (!res.ok) return showToast('❌ Delete failed', 'error');
      showToast('🗑️ File deleted', 'success');
      loadFiles();
    } catch(e) {
      showToast('❌ Delete failed', 'error');
    }
  }

  // ── DRAG & DROP ───────────────────────────────────────
  const zone = document.getElementById('upload-zone');
  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const dt = e.dataTransfer;
    if (dt.files.length) {
      document.getElementById('file-input').files = dt.files;
      handleUpload(document.getElementById('file-input'));
    }
  });

  // ── HELPERS ───────────────────────────────────────────
  function showError(el, msg) {
    el.textContent = msg;
    el.style.display = 'block';
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  let toastTimer;
  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = '', 3000);
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const lf = document.getElementById('login-form');
      const rf = document.getElementById('register-form');
      if (lf.style.display !== 'none') handleLogin();
      else if (rf.style.display !== 'none') handleRegister();
    }
  });
</script>
</body>
</html>
